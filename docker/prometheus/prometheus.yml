global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: identity-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - identity-service:8080
        labels:
          service: IdentityService

  - job_name: audit-logging
    metrics_path: /metrics
    static_configs:
      - targets:
          - audit-logging:8081
        labels:
          service: AuditLogging

  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:8088
        labels:
          service: ApiGateway
