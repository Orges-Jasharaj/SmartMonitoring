services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SmartMonitoring@123"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SmartMonitoring@123' -C -Q 'SELECT 1' > /dev/null 2>&1 || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'SmartMonitoring@123' -Q 'SELECT 1' > /dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  identity-service:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DisableHttpsRedirection: "true"
      Database__RunMigrationsOnStartup: "true"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=SmartMonitoringIdentityDb;User Id=sa;Password=SmartMonitoring@123;TrustServerCertificate=True;"
      Jwt__Key: "DockerDevJwtKey-MustBeAtLeast32CharactersLong!"
      Jwt__Issuer: SmartMonitoring.Identity
      Jwt__Audience: SmartMonitoring.Clients
      Observability__LokiUrl: http://loki:3100
      Observability__OtlpEndpoint: http://tempo:4317
      Observability__RestrictMetricsToLocalhost: "false"
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: kafka:9092
      Audit__Enabled: "true"
      Audit__ServiceName: IdentityService
      Audit__Transport: Kafka
      Audit__BaseUrl: http://audit-logging:8081
      Audit__ApiKey: dev-audit-api-key-change-in-production
      AdminUser__Password: "Admin@123456"
      Email__Enabled: "true"
      Email__Host: mailpit
      Email__Port: "1025"
      Email__UseSsl: "false"
      Email__FromAddress: noreply@smartmonitoring.local
      Email__FromName: SmartMonitoring
      Email__ConfirmationBaseUrl: http://localhost:8088/identity/api/authentication/confirm-email
      Email__ResetPasswordBaseUrl: http://localhost:8088/identity/reset-password
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 180s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: smartmonitoring
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  api-gateway:
    build:
      context: ..
      dockerfile: ApiGateway/Dockerfile
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DisableHttpsRedirection: "true"
      Observability__LokiUrl: http://loki:3100
      Observability__OtlpEndpoint: http://tempo:4317
      Observability__RestrictMetricsToLocalhost: "false"
      ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address: http://identity-service:8080/
      ReverseProxy__Clusters__audit-cluster__Destinations__destination1__Address: http://audit-logging:8081/
      ReverseProxy__Clusters__monitoring-cluster__Destinations__destination1__Address: http://monitoring-service:8082/
      ReverseProxy__Clusters__notification-cluster__Destinations__destination1__Address: http://notification-service:8083/
    depends_on:
      identity-service:
        condition: service_healthy
      audit-logging:
        condition: service_healthy
      monitoring-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8088'"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s

  monitoring-service:
    build:
      context: ..
      dockerfile: MonitoringService/Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DisableHttpsRedirection: "true"
      Database__RunMigrationsOnStartup: "true"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=SmartMonitoringMonitoringDb;User Id=sa;Password=SmartMonitoring@123;TrustServerCertificate=True;"
      Jwt__Key: "DockerDevJwtKey-MustBeAtLeast32CharactersLong!"
      Jwt__Issuer: SmartMonitoring.Identity
      Jwt__Audience: SmartMonitoring.Clients
      Observability__LokiUrl: http://loki:3100
      Observability__OtlpEndpoint: http://tempo:4317
      Observability__RestrictMetricsToLocalhost: "false"
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: kafka:9092
      Audit__Enabled: "true"
      Audit__ServiceName: MonitoringService
      Audit__Transport: Kafka
      Audit__BaseUrl: http://audit-logging:8081
      Audit__ApiKey: dev-audit-api-key-change-in-production
      Notification__Enabled: "true"
      Notification__Transport: Kafka
      Notification__BaseUrl: http://notification-service:8083
      Notification__ApiKey: dev-notification-api-key-change-in-production
      Alert__ActiveAlertReminderMinutes: "1"
      Alert__DeviceOfflineAfterMinutes: "30"
      Alert__OfflineCheckIntervalMinutes: "5"
      ReadingRetention__Enabled: "true"
      ReadingRetention__RetentionDays: "90"
      ReadingRetention__CleanupIntervalHours: "24"
      ReadingPersistence__Enabled: "true"
      ReadingPersistence__HeartbeatMinutes: "5"
      Identity__BaseUrl: http://identity-service:8080
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8082'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 180s

  notification-service:
    build:
      context: ..
      dockerfile: NotificationService/Dockerfile
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DisableHttpsRedirection: "true"
      Observability__LokiUrl: http://loki:3100
      Observability__OtlpEndpoint: http://tempo:4317
      Observability__RestrictMetricsToLocalhost: "false"
      NotificationApiKey__ApiKey: dev-notification-api-key-change-in-production
      Email__Enabled: "true"
      Email__Host: mailpit
      Email__Port: "1025"
      Email__UseSsl: "false"
      Email__FromAddress: alerts@smartmonitoring.local
      Email__FromName: SmartMonitoring Alerts
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: kafka:9092
    depends_on:
      mailpit:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8083'"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 60s

  audit-logging:
    build:
      context: ..
      dockerfile: AuditLogging/Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DisableHttpsRedirection: "true"
      Database__RunMigrationsOnStartup: "true"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=SmartMonitoringAuditDb;User Id=sa;Password=SmartMonitoring@123;TrustServerCertificate=True;"
      Observability__LokiUrl: http://loki:3100
      Observability__OtlpEndpoint: http://tempo:4317
      Observability__RestrictMetricsToLocalhost: "false"
      AuditApiKey__ApiKey: dev-audit-api-key-change-in-production
      AuditRetention__Enabled: "true"
      AuditRetention__RetentionDays: "90"
      AuditRetention__CleanupIntervalHours: "24"
      Jwt__Key: "DockerDevJwtKey-MustBeAtLeast32CharactersLong!"
      Jwt__Issuer: SmartMonitoring.Identity
      Jwt__Audience: SmartMonitoring.Clients
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: kafka:9092
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8081'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 180s

  loki:
    image: grafana/loki:3.0.0
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    depends_on:
      identity-service:
        condition: service_healthy

  tempo:
    image: grafana/tempo:2.5.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "3200:3200"
      - "4317:4317"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:11.0.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_started
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      identity-service:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  sqlserver-data:
  loki-data:
  prometheus-data:
  tempo-data:
  grafana-data:
